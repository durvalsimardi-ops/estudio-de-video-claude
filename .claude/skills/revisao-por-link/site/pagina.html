<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>Revisão do vídeo</title>
<style>
  /* Troque a cor de destaque pela da sua marca. */
  :root { --cor: #2E6BFF; --fundo: #F6F7F9; --cartao: #FFFFFF; --texto: #14161A; --apoio: #6C7686; --linha: #E3E6EC; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; }
  .versoes { display: flex; gap: 6px; flex-wrap: wrap; }
  .versoes button { border: 1px solid var(--linha); background: var(--cartao); color: var(--texto); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .versoes button.ativa { background: var(--cor); border-color: var(--cor); color: #fff; }
  .grade { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grade { grid-template-columns: 1fr; } }
  .video { background: #000; border-radius: 14px; overflow: hidden; }
  video { display: block; width: 100%; max-height: 72vh; background: #000; }
  .barra { position: relative; height: 22px; margin: 8px 2px 0; }
  .barra::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--linha); }
  .marca { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--cor); border: 2px solid #fff; cursor: pointer; }
  .nota { color: var(--apoio); font-size: 14px; margin: 8px 2px 0; }
  .cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 16px; }
  label { display: block; font-size: 13px; color: var(--apoio); margin: 0 0 4px; }
  input, textarea { width: 100%; border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; font: inherit; color: var(--texto); background: #fff; }
  input:focus, textarea:focus { outline: 2px solid var(--cor); outline-offset: -1px; }
  textarea { min-height: 88px; resize: vertical; margin-bottom: 10px; }
  .campo { margin-bottom: 10px; }
  .escondido { position: absolute; left: -9999px; }
  .enviar { width: 100%; border: 0; border-radius: 10px; background: var(--cor); color: #fff; font: inherit; font-weight: 600; padding: 12px; cursor: pointer; }
  .enviar:disabled { opacity: .5; cursor: default; }
  .aviso { font-size: 14px; min-height: 20px; margin: 8px 0 0; color: var(--apoio); }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  ol { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--linha); padding: 10px 0; }
  .tempo { border: 0; background: none; color: var(--cor); font: inherit; font-weight: 700; padding: 0; cursor: pointer; }
  .quem { color: var(--apoio); font-size: 14px; }
  .apagar { border: 0; background: none; color: var(--apoio); font-size: 13px; text-decoration: underline; cursor: pointer; float: right; }
  .vazio { color: var(--apoio); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="titulo">Carregando…</h1>
    <div class="versoes" id="versoes"></div>
  </header>
  <div class="grade">
    <section>
      <div class="video"><video id="video" controls playsinline preload="metadata"></video></div>
      <div class="barra" id="barra" aria-label="Comentários na linha do tempo"></div>
      <p class="nota" id="nota"></p>
    </section>
    <aside class="cartao">
      <p class="nota" style="margin-top:0">Pause onde quer mudar e escreva. O comentário fica preso naquele segundo.</p>
      <form id="form">
        <div class="campo"><label for="nome">Seu nome</label><input id="nome" maxlength="40" autocomplete="name" required></div>
        <label for="texto">O que mudar neste ponto?</label>
        <textarea id="texto" maxlength="1000" required></textarea>
        <input class="escondido" id="site" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="enviar" id="enviar" type="submit">Comentar em 0:00,0</button>
        <p class="aviso" id="aviso" role="status"></p>
      </form>
      <h2 id="contagem">Comentários</h2>
      <ol id="lista"></ol>
    </aside>
  </div>
</main>
<script>
const codigo = location.pathname.split("/").filter(Boolean)[1];
const $ = (id) => document.getElementById(id);
const video = $("video");
let peca = null, versao = 1, tempoMarcado = 0, digitando = false;

const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`.replace(".", ",");
const guardado = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
const minhas = () => { try { return JSON.parse(guardado("revisao-chaves") || "{}"); } catch (e) { return {}; } };

function marcarTempo() {
  tempoMarcado = Math.round(video.currentTime * 10) / 10;
  $("enviar").textContent = `Comentar em ${fmt(tempoMarcado)}`;
}
video.addEventListener("timeupdate", () => { if (!digitando) marcarTempo(); });
video.addEventListener("seeked", marcarTempo);
$("texto").addEventListener("focus", () => { video.pause(); marcarTempo(); digitando = true; });
$("texto").addEventListener("blur", () => { if (!$("texto").value.trim()) digitando = false; });
$("nome").value = guardado("revisao-nome") || "";

function trocarVersao(n) {
  versao = n;
  const v = peca.versoes.find((x) => x.n === n);
  if (video.src.startsWith("blob:")) URL.revokeObjectURL(video.src);
  video.src = `/p/${codigo}/${v.arquivo}`;
  // Sem "Range" no servidor o navegador não consegue pular para um segundo do vídeo.
  // Nesse caso a página baixa a prévia inteira (até 25 MB) e toca da memória.
  video.addEventListener("loadedmetadata", async () => {
    if (video.seekable.length && video.seekable.end(0) > 0) return;
    const r = await fetch(`/p/${codigo}/${v.arquivo}`);
    if (r.ok && versao === n) video.src = URL.createObjectURL(await r.blob());
  }, { once: true });
  $("nota").textContent = v.nota ? `O que mudou na v${n}: ${v.nota}` : "";
  document.querySelectorAll(".versoes button").forEach((b) => b.classList.toggle("ativa", +b.dataset.n === n));
  carregarComentarios();
}

async function carregarComentarios() {
  const r = await fetch(`/api/comentarios?peca=${codigo}&versao=${versao}`);
  const lista = r.ok ? await r.json() : [];
  const chaves = minhas();
  $("contagem").textContent = `Comentários na v${versao} (${lista.length})`;
  $("lista").innerHTML = "";
  $("barra").innerHTML = "";
  if (!lista.length) $("lista").innerHTML = '<li class="vazio">Nenhum comentário ainda.</li>';
  const dur = peca.versoes.find((x) => x.n === versao).duracao || 1;
  for (const c of lista) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "tempo"; b.textContent = fmt(c.t);
    b.onclick = () => { video.currentTime = c.t; video.pause(); };
    li.append(b, " ");
    const quem = document.createElement("span"); quem.className = "quem"; quem.textContent = c.nome;
    li.append(quem);
    if (chaves[c.id]) {
      const x = document.createElement("button"); x.className = "apagar"; x.textContent = "apagar";
      x.onclick = async () => { await fetch(`/api/comentarios?id=${c.id}&chave=${chaves[c.id]}`, { method: "DELETE" }); carregarComentarios(); };
      li.append(x);
    }
    const p = document.createElement("div"); p.textContent = c.texto; li.append(p);
    $("lista").append(li);
    const m = document.createElement("span");
    m.className = "marca"; m.style.left = `${Math.min(100, (c.t / dur) * 100)}%`; m.title = `${fmt(c.t)} · ${c.nome}`;
    m.onclick = b.onclick;
    $("barra").append(m);
  }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nome = $("nome").value.trim(), texto = $("texto").value.trim();
  if (!nome || !texto) return;
  guardado("revisao-nome", nome);
  $("enviar").disabled = true; $("aviso").textContent = "Enviando…";
  const r = await fetch("/api/comentarios", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ peca: codigo, versao, t: tempoMarcado, nome, texto, site: $("site").value }),
  });
  const d = await r.json().catch(() => ({}));
  $("enviar").disabled = false;
  if (!r.ok) { $("aviso").textContent = d.erro || "Não foi. Tente de novo."; return; }
  const chaves = minhas(); chaves[d.id] = d.chave; guardado("revisao-chaves", JSON.stringify(chaves));
  $("texto").value = ""; digitando = false;
  $("aviso").textContent = `Comentário salvo em ${fmt(tempoMarcado)}. Pode dar play e seguir.`;
  carregarComentarios();
});

(async () => {
  const r = await fetch(`/p/${codigo}/peca.json`, { cache: "no-store" });
  if (!r.ok) { $("titulo").textContent = "Link não encontrado"; $("form").hidden = true; return; }
  peca = await r.json();
  document.title = `Revisão · ${peca.titulo}`;
  $("titulo").textContent = peca.titulo;
  for (const v of peca.versoes) {
    const b = document.createElement("button");
    b.textContent = `v${v.n}`; b.dataset.n = v.n; b.type = "button";
    b.onclick = () => trocarVersao(v.n);
    $("versoes").append(b);
  }
  trocarVersao(peca.versoes[peca.versoes.length - 1].n);
})();
</script>
</body>
</html>
